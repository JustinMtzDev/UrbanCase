<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCase — Iniciar Sesión</title>
  <link rel="icon" type="image/png" href="icono_web.png">
  <link rel="apple-touch-icon" href="icono_web.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function(){ try { if (localStorage.getItem('urbancase-texto-grande') === '1') document.documentElement.classList.add('texto-grande'); } catch(_){} })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    html.texto-grande { font-size: 18px; }

    body,
    body * {
      -webkit-user-select: none;
      user-select: none;
    }

    .form-group input,
    .form-group input * {
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    body {
      background: #0f0f0f;
      color: #e8e8ed;
    }
    body.theme-dark .blob1 { background: #00d4aa; }
    body.theme-dark .blob2 { background: #00a884; }
    body.theme-dark .blob3 { background: #00f5c4; }

    .blob {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      animation: moveBlob 20s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .blob { opacity: 0.8; }
    .blob1 { background: #ff3131; top: -100px; left: -100px; }
    .blob2 { background: #ff5757; bottom: -120px; right: -120px; animation-duration: 25s; }
    .blob3 { background: #ff1f1f; top: 40%; left: 60%; animation-duration: 18s; }

    @keyframes moveBlob {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(150px, -100px) scale(1.2); }
      100% { transform: translate(-100px, 150px) scale(0.9); }
    }

    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 40px 36px;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 24px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .login-logo .logo-icon { height: 140px; width: auto; }
    .login-logo .logo-brand { height: 80px; width: auto; }

    .login-logo-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .login-logo-btn .logo-icon-light { display: block; }
    .login-logo-btn .logo-icon-dark { display: none; }
    .login-logo-btn:hover .logo-icon-light { display: none; }
    .login-logo-btn:hover .logo-icon-dark { display: block; }
    body.theme-dark .login-logo-btn .logo-icon-light { display: none; }
    body.theme-dark .login-logo-btn .logo-icon-dark { display: block; }
    body.theme-dark .login-logo-btn:hover .logo-icon-light { display: block; }
    body.theme-dark .login-logo-btn:hover .logo-icon-dark { display: none; }

    .login-title {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .login-title { color: rgba(255, 255, 255, 0.6); }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .form-group label { color: rgba(255, 255, 255, 0.6); }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e8e8ed !important;
      -webkit-text-fill-color: #e8e8ed;
      caret-color: #e8e8ed;
    }
    .form-group input::placeholder,
    .form-group input::-webkit-input-placeholder {
      color: #8888a0 !important;
      -webkit-text-fill-color: #8888a0 !important;
      opacity: 1;
    }
    body:not(.theme-dark) .form-group input::placeholder,
    body:not(.theme-dark) .form-group input::-webkit-input-placeholder {
      color: #5c5c66 !important;
      -webkit-text-fill-color: #5c5c66 !important;
    }
    .form-group input:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    body:not(.theme-dark) .form-group input:focus {
      border-color: #ff3131;
      box-shadow: 0 0 0 3px rgba(255, 49, 49, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #e8e8ed !important;
      -webkit-text-fill-color: #e8e8ed !important;
      caret-color: #e8e8ed;
    }
    body.theme-dark .form-group input:focus,
    html.theme-dark .form-group input:focus {
      border-color: #00d4aa;
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #e8e8ed !important;
      -webkit-text-fill-color: #e8e8ed !important;
      caret-color: #00d4aa;
    }
    .form-group input:focus::placeholder,
    .form-group input:focus::-webkit-input-placeholder {
      color: #8888a0;
      -webkit-text-fill-color: #8888a0;
    }
    body:not(.theme-dark) .form-group input:focus::placeholder,
    body:not(.theme-dark) .form-group input:focus::-webkit-input-placeholder {
      color: #5c5c66;
      -webkit-text-fill-color: #5c5c66;
    }
    body:not(.theme-dark) .form-group input:not(:placeholder-shown) {
      border-color: #ff3131;
      box-shadow: 0 0 0 3px rgba(255, 49, 49, 0.15);
    }
    body.theme-dark .form-group input:not(:placeholder-shown) {
      border-color: #00d4aa;
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.2);
    }

    .input-password-wrap {
      position: relative;
    }
    .input-password-wrap input {
      padding-right: 48px;
    }
    .btn-toggle-pass {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      opacity: 0.5;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-toggle-pass:hover {
      opacity: 0.9;
    }
    .icon-ojo {
      width: 32px;
      height: 32px;
    }
    .icon-ojo-hover { display: none; }
    .btn-toggle-pass:hover .icon-ojo-default { display: none; }
    .btn-toggle-pass:hover .icon-ojo-hover { display: block; }
    .btn-toggle-pass.pass-visible .icon-ojo-default { display: none; }
    .btn-toggle-pass.pass-visible .icon-ojo-hover { display: block; }
    .btn-toggle-pass.pass-visible:hover .icon-ojo-default { display: block; }
    .btn-toggle-pass.pass-visible:hover .icon-ojo-hover { display: none; }
    .form-group input:-webkit-autofill,
    .form-group input:-webkit-autofill:hover,
    .form-group input:-webkit-autofill:focus,
    .form-group input:-webkit-autofill:active,
    .form-group input:autofill {
      color: #e8e8ed !important;
      -webkit-text-fill-color: #e8e8ed !important;
      background-color: rgba(255, 255, 255, 0.06) !important;
      -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.06) inset !important;
      box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.06) inset !important;
      font-family: 'DM Sans', sans-serif !important;
      font-size: 1rem !important;
      font-weight: 400 !important;
      transition: background-color 5000s ease-in-out 0s, color 5000s ease-in-out 0s;
    }
    body:not(.theme-dark) .form-group input:-webkit-autofill,
    body:not(.theme-dark) .form-group input:-webkit-autofill:hover,
    body:not(.theme-dark) .form-group input:-webkit-autofill:focus,
    body:not(.theme-dark) .form-group input:-webkit-autofill:active,
    body:not(.theme-dark) .form-group input:autofill {
      border: 1px solid #ff3131 !important;
      box-shadow: 0 0 0 3px rgba(255, 49, 49, 0.15), 0 0 0 1000px rgba(255, 255, 255, 0.06) inset !important;
      -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.06) inset !important;
      caret-color: #e8e8ed !important;
    }
    body.theme-dark .form-group input:-webkit-autofill,
    body.theme-dark .form-group input:-webkit-autofill:hover,
    body.theme-dark .form-group input:-webkit-autofill:focus,
    body.theme-dark .form-group input:-webkit-autofill:active,
    body.theme-dark .form-group input:autofill,
    html.theme-dark .form-group input:-webkit-autofill,
    html.theme-dark .form-group input:-webkit-autofill:hover,
    html.theme-dark .form-group input:-webkit-autofill:focus,
    html.theme-dark .form-group input:-webkit-autofill:active,
    html.theme-dark .form-group input:autofill {
      border: 1px solid #00d4aa !important;
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.2), 0 0 0 1000px rgba(255, 255, 255, 0.06) inset !important;
      -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.06) inset !important;
      caret-color: #00d4aa !important;
    }
    .form-group input::selection {
      background: rgba(255, 49, 49, 0.3);
      color: #fff;
    }
    body.theme-dark .form-group input::selection {
      background: rgba(0, 212, 170, 0.4);
      color: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-login {
      background: linear-gradient(135deg, #ff3131, #c92b2b);
    }
    body.theme-dark .btn-login {
      background: linear-gradient(135deg, #00d4aa, #00a884);
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-error {
      display: none;
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid rgba(255, 59, 48, 0.3);
      color: #ff6b6b;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .login-error.visible { display: block; }
  </style>
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="login-card">
    <div class="login-logo">
      <button type="button" class="login-logo-btn" id="login-logo-btn" title="Cambiar tema">
        <img src="img/logo.svg" alt="" class="logo-icon logo-icon-light">
        <img src="img/logoDark.svg" alt="" class="logo-icon logo-icon-dark">
      </button>
      <img src="img/urbanCase.svg" alt="UrbanCase" class="logo-brand">
    </div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form" method="post" action="/login.html" autocomplete="on">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="username" placeholder="Ej. admin" required autocomplete="username" spellcheck="false" autocapitalize="none" autocorrect="off" readonly>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-password-wrap">
          <input type="password" id="password" name="password" placeholder="XXXXXXXXXXXX" required autocomplete="current-password" spellcheck="false" readonly>
          <button type="button" class="btn-toggle-pass" id="btn-toggle-pass" tabindex="-1" title="Mostrar contraseña">
            <img src="img/icon_ojo_cerrado.svg" alt="" class="icon-ojo icon-ojo-default" id="icon-ojo-default" data-src="img/icon_ojo_cerrado.svg" data-src-dark="img/icon_ojo_cerrado_dark.svg">
            <img src="img/icon_ojo_abierto.svg" alt="" class="icon-ojo icon-ojo-hover" id="icon-ojo-hover" data-src="img/icon_ojo_abierto.svg" data-src-dark="img/icon_ojo_abierto_dark.svg">
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>
  </div>

  <script>
    const API = (window.location.protocol === 'file:') ? 'http://localhost:3000/api' : '/api';
    const T = window.UrbanCaseTheme;

    function actualizarIconosOjo() {
      const dark = document.body.classList.contains('theme-dark');
      document.querySelectorAll('#icon-ojo-default, #icon-ojo-hover').forEach(img => {
        if (img.dataset.src) img.src = dark ? img.dataset.srcDark : img.dataset.src;
      });
    }
    T?.aplicarTemaDesdePreferencia();
    T?.iniciarTemaAutomatico(actualizarIconosOjo);
    actualizarIconosOjo();
    const $logoBtn = document.getElementById('login-logo-btn');
    if ($logoBtn) {
      $logoBtn.addEventListener('click', () => {
        T?.alternarTemaManual();
        actualizarIconosOjo();
      });
    }

    function irAlInicioTrasLogin() {
      try {
        localStorage.removeItem('uc_modulo');
        localStorage.removeItem('uc_sucursal');
      } catch (_) {}
      window.location.href = (window.location.protocol === 'file:' ? 'http://localhost:3000' : '') + '/index.html';
    }

    if (localStorage.getItem('uc_token')) {
      fetch(API + '/auth/me', {
        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('uc_token') }
      }).then(r => { if (r.ok) irAlInicioTrasLogin(); });
    }

    const $togglePass = document.getElementById('btn-toggle-pass');
    const $passInput = document.getElementById('password');
    $togglePass.addEventListener('click', () => {
      const visible = $passInput.type === 'text';
      $passInput.type = visible ? 'password' : 'text';
      $togglePass.classList.toggle('pass-visible', !visible);
    });

    const $form = document.getElementById('login-form');
    const $error = document.getElementById('login-error');
    const $btn = document.getElementById('btn-login');
    const $usuarioInput = document.getElementById('usuario');
    let loginFormActivo = false;
    let limpiezaTimeouts = [];

    function cancelarLimpiezaLogin() {
      limpiezaTimeouts.forEach(clearTimeout);
      limpiezaTimeouts = [];
    }

    function bloquearAutollenadoInicial() {
      if (loginFormActivo) return;
      $usuarioInput?.setAttribute('readonly', 'readonly');
      $passInput?.setAttribute('readonly', 'readonly');
    }

    function habilitarFormularioLogin() {
      if (loginFormActivo) return;
      loginFormActivo = true;
      cancelarLimpiezaLogin();
      $usuarioInput?.removeAttribute('readonly');
      $passInput?.removeAttribute('readonly');
    }

    function limpiarFormularioLogin() {
      if (loginFormActivo) return;
      $form?.reset();
      if ($usuarioInput) $usuarioInput.value = '';
      if ($passInput) {
        $passInput.value = '';
        $passInput.type = 'password';
      }
      bloquearAutollenadoInicial();
      $togglePass?.classList.remove('pass-visible');
      $error?.classList.remove('visible');
    }

    function programarLimpiezaLogin() {
      loginFormActivo = false;
      cancelarLimpiezaLogin();
      limpiarFormularioLogin();
      [50, 150, 400, 800].forEach((ms) => {
        limpiezaTimeouts.push(setTimeout(limpiarFormularioLogin, ms));
      });
    }

    [$form, $usuarioInput, $passInput].forEach((el) => {
      if (!el) return;
      ['mousedown', 'touchstart', 'keydown'].forEach((evt) => {
        el.addEventListener(evt, habilitarFormularioLogin, { capture: true });
      });
    });
    $usuarioInput?.addEventListener('input', habilitarFormularioLogin);

    (function initAutofillDetect() {
      const style = document.createElement('style');
      style.textContent = '@keyframes uc-login-autofill-start { from {} to {} } #login-form input:-webkit-autofill { animation-name: uc-login-autofill-start; }';
      document.head.appendChild(style);
      [$usuarioInput, $passInput].forEach((input) => {
        input?.addEventListener('animationstart', (e) => {
          if (e.animationName === 'uc-login-autofill-start') habilitarFormularioLogin();
        });
      });
    })();

    programarLimpiezaLogin();
    window.addEventListener('pageshow', programarLimpiezaLogin);

    $form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $error.classList.remove('visible');
      $btn.disabled = true;
      $btn.textContent = 'Verificando...';

      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          const msg = data.error || ('Error ' + res.status);
          $error.textContent = msg;
          $error.classList.add('visible');
          console.error('Login falló:', res.status, data);
          return;
        }

        localStorage.setItem('uc_token', data.token);
        localStorage.setItem('uc_usuario', JSON.stringify(data.usuario));
        var usr = (data.usuario && data.usuario.usuario) ? String(data.usuario.usuario).toLowerCase() : '';
        try { localStorage.setItem('urbancase-texto-grande', usr === 'edgar' ? '1' : '0'); } catch(_){}
        irAlInicioTrasLogin();
      } catch (err) {
        $error.textContent = 'No se pudo conectar con el servidor. ¿Está corriendo node index.js en la carpeta server?';
        $error.classList.add('visible');
        console.error('Login error de red:', err);
      } finally {
        $btn.disabled = false;
        $btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
